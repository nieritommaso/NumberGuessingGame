<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.2/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="./css/styles.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">

</head>

<body class="backBodyGradient">

    <div class="text-center border border-black bg-white w-75 mx-auto py-3">
        <h1>Number Guessing Game</h1>
        <h2> <i class="bi bi-arrow-right-circle" onclick="istruzioni()" id="freccia"></i> Istruzioni</h2>
        <p id="istruzioni" class="d-none fst-italic">Il computer genera un numero casuale da 0 a 100. Tu dovrai provare
            a indovinarlo. Hai 7 tentativi</p>
        <button type="button" class="btn btn-primary" onclick="gioca()">Gioca</button>
    </div>

    <div class="row  text-center mx-auto my-5 d-none py-4 w-75" id="gioco">

        <div>
            <form>
                <input type="number" id="numScelto">
                <button type="button" class="btn btn-primary" onclick="controllo()">Gioca</button>
            </form>
            <h1 id="risultato"></h1>
        </div>

        <div class="col-sm-4 my-3">
            <p>Tentativi rimasti</p>
            <i class="bi bi-joystick fs-4"></i>
            <p id="numTentativi">7</p>
        </div>

        <div class="col-sm-4 my-3">
            <p>Suggerimenti</p>
            <i class="bi bi-info-square fs-4"></i>
            <p class="text-primary fst-italic" id="suggerimento"></p>

        </div>

        <div class="col-sm-4 my-3">
            <p>Numeri inseriti</p>
            <i class="bi bi-check-square fs-4"></i>
            <p id="numInseriti"></p>
        </div>
    </div>




    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
        crossorigin="anonymous"></script>
    <script src="./js/script.js"></script>
</body>

</html>
